services:
  privana-services:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - ENV_FILE=.env.mainnet
    image: "ghcr.io/oasisprotocol/privana-services@sha256:064f8fe08779b60a6a3bf939ab61d7739f6e2084977c1a9037b0e7c3f4c39927"
    platform: linux/amd64
    environment:
      - LIQUIDITY_PROVIDER_SECRET_KEY
      - POOL_ADMIN_SECRET_KEY
      - EARN_POOL_SECRET_KEY
      - SAPPHIRE_RPC_HEADERS
      - BASE_RPC_URL
      - LIFI_API_KEY
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - data:/app/data
    ports:
      - "8000:8000"
    annotations:
      net.oasis.proxy.ports.8000.custom_domain: services.privana.finance
    restart: on-failure

volumes:
  data:
