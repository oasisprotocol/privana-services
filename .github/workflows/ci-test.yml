name: CI Tests

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          LIQUIDITY_PROVIDER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          LIQUIDITY_PROVIDER_ADDRESS=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          ACCOUNTING_CONTRACT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
          ACCOUNTING_CHAIN_ID=23295
          SWAP_MANAGER_CONTRACT_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
          SAPPHIRE_RPC_URL=https://testnet.sapphire.oasis.io
          EOF

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  integration-tests:
    name: Integration Tests (Testnet)
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create .env from testnet config + secrets
        run: |
          cp .env.testnet .env
          echo "" >> .env
          echo "LIFI_API_KEY=${{ secrets.LIFI_API_KEY }}" >> .env
          echo "LIQUIDITY_PROVIDER_PRIVATE_KEY=${{ secrets.LIQUIDITY_PROVIDER_PRIVATE_KEY }}" >> .env

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -s

  solidity-tests:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile contracts
        run: bun run build

      - name: Run tests
        run: bun run test
