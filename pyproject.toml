[project]
name = "flexvaults-swap"
version = "0.1.0"
description = "Order routing service for FlexVaults token swaps via Li.Fi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.135,<0.137",
    "uvicorn[standard]>=0.42,<0.44",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.30",
    "web3>=7.14,<8",
    "eth-account>=0.13,<0.14",
    "oasis-sapphire-py>=0.4.2,<0.5",
    "oasis-privana>=0.1.16,<0.2",
]

[project.scripts]
flexvaults-swap = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests against live testnet (require .env credentials)",
]
