name: CI Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  integration-tests:
    name: Integration Tests (Testnet)
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration tests
        env:
          LIQUIDITY_PROVIDER_SECRET_KEY: ${{ secrets.LIQUIDITY_PROVIDER_SECRET_KEY }}
          LIFI_API_KEY: ${{ secrets.LIFI_API_KEY }}
        run: uv run pytest tests/integration/ -v -s

  solidity-tests:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile contracts
        run: bun run build

      - name: Run tests
        run: bun run test
